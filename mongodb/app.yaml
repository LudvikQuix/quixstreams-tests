name: mongodb
language: docker
variables:
  - name: MONGO_INITDB_ROOT_USERNAME
    inputType: FreeText
    description: >-
      Root username MongoDB is initialised with. Must match the MONGO_USER member of the
      mongodb-connection variable group, which is what the Dynamic Configuration Manager
      authenticates with.
    defaultValue: admin
    required: true
  - name: MONGO_INITDB_ROOT_PASSWORD
    inputType: Secret
    description: >-
      Root password MongoDB is initialised with. Must match the MONGO_PASSWORD member of the
      mongodb-connection variable group.
    defaultValue: mongo_password
    required: true
  - name: MONGO_DBPATH
    inputType: FreeText
    description: >-
      Absolute path to the mongod data directory. Must be a directory inside the /app/state
      state volume; the entry point refuses to start on any other path, because container-local
      storage is discarded on restart. Bumping this to an unused sibling directory (mongodb-v3,
      ...) is the supported way to force a clean database with no shell in the container: mongod
      initialises from scratch and the old directory is left untouched on the volume. The entry
      point never deletes data, so reclaiming an abandoned directory's space is a separate manual
      step. Wiping Mongo invalidates every configuration the config-updates topic still
      references - delete and recreate that topic in the same action, and bump RUN_ID.
    defaultValue: /app/state/mongodb-v2
    required: true
dockerfile: dockerfile
defaultFile: dockerfile
