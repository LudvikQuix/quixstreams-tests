name: lookup-sink
language: python
variables:
  - name: input
    inputType: InputTopic
    description: >-
      Keyed sensor records. Both arms read the same topic, which is what makes the
      buffered-vs-control comparison a paired row-level join rather than two runs.
    defaultValue: sensor-data
    required: true
  - name: config_topic
    inputType: InputTopic
    description: >-
      Dynamic Configuration Manager change events, consumed by QuixConfigurationService.
      The lookup ASSIGNS every partition from offset 0 on each start, bypassing the
      consumer-group protocol, so it always rebuilds the full configuration history.
      Truncating this topic silently un-configures every device.
    defaultValue: config-updates
    required: true
  - name: output
    inputType: OutputTopic
    description: Enriched records from both arms, separated by the arm column.
    defaultValue: enriched-sensor-data
    required: true
  - name: ARM
    inputType: FreeText
    description: >-
      Label stamped on every emitted row (buffered | control). The verification queries
      slice on it.
    defaultValue: buffered
    required: false
  - name: BUFFER_ENABLED
    inputType: FreeText
    description: >-
      true/1/yes/on builds a LookupBuffer; anything else, INCLUDING BLANK, passes
      buffer=None, which is today's unbuffered behaviour. Blank is the control arm. A
      deployment with this on is stateful and needs state: {enabled: true} in quix.yaml;
      a deployment with it off registers no store and must NOT carry a state block.
    defaultValue: "true"
    required: false
  - name: GRACE_MS
    inputType: FreeText
    description: >-
      Wall-clock milliseconds a record may wait for its configuration, measured from
      operator entry - not event time, not the record timestamp. Must exceed
      config-seeder's SEED_DELAY_SECONDS*1000, or the earliest pre-seed records time out
      before their configuration arrives. Ignored when BUFFER_ENABLED is off; kept on the
      control arm only so the column is populated identically on both arms.
    defaultValue: "300000"
    required: false
  - name: ON_TIMEOUT
    inputType: FreeText
    description: >-
      emit releases a timed-out record with each field's default=, byte-identical to what
      an unbuffered join_lookup would have produced; drop discards it with a rate-limited
      warning naming the key. Flip to drop for the V-DROP variant run.
    defaultValue: emit
    required: false
  - name: MAX_BUFFERED_PER_KEY
    inputType: FreeText
    description: >-
      Per-key buffer cap. Steady state at the rig's default sizing is about 60 records per
      key. Drop it to 5 for the overflow variants. A release deserializes a key's whole
      surviving buffer in one callback, and the buffer warns past 1000 records.
    defaultValue: "10000"
    required: false
  - name: ON_OVERFLOW
    inputType: FreeText
    description: >-
      drop-newest silently discards new records once a key hits MAX_BUFFERED_PER_KEY;
      raise throws LookupBufferOverflowError and kills the application. An overflowed
      record never entered the buffer, so ON_TIMEOUT does not apply to it.
    defaultValue: drop-newest
    required: false
  - name: STORE_NAME
    inputType: FreeText
    description: >-
      Name of the changelog-backed timestamped state store holding withheld records. Bump
      it to force a clean store without touching the consumer group.
    defaultValue: lookup-buffer
    required: false
  - name: CONFIG_TYPE
    inputType: FreeText
    description: >-
      Configuration type passed to every json_field. Fixed at pipeline-build time; must
      equal config-seeder's CONFIG_TYPE, because the lookup will not check it.
    defaultValue: device
    required: false
  - name: SEEDED_DEVICE_COUNT
    inputType: FreeText
    description: >-
      Used only to compute seeded_expected on each row, so verification asserts against an
      a-priori expectation rather than against the seeder's own output. Must equal
      config-seeder's value.
    defaultValue: "50"
    required: false
  - name: KEY_DESERIALIZER
    inputType: FreeText
    description: >-
      Key deserializer for the DATA topic only; str (default) or int, anything else
      raises at startup. The lookup resolves configurations by message key and the
      buffer prefixes its store on that key, so int is what drives a non-string key
      through both. Must match data-generator's KEY_TYPE. The output topic's
      key_serializer stays str regardless, so under int the emit path is expected to
      reject the key.
    defaultValue: str
    required: false
  - name: STAMP_MESSAGE_CONTEXT
    inputType: FreeText
    description: >-
      true/1/yes/on adds src_topic, src_partition and src_offset to every emitted row,
      read from message_context() after the join - the same accessor sdf.sink() uses, so
      the columns are the attribution a lakehouse sink wired in here would record. This
      is the T5 instrument: a record released from the buffer by another key's traffic
      carries the TRIGGERING record's context, while one settled by the deadline tick
      carries its own, and only these columns make the difference visible. Off by
      default, which leaves the table schema unchanged; adding the columns evolves the
      lake table, so bump Lake Sink's TABLE_VERSION when switching it on.
    defaultValue: "false"
    required: false
  - name: CONSUMER_GROUP
    inputType: FreeText
    description: >-
      Kafka consumer group. MUST DIFFER BETWEEN THE TWO ARMS, or they split the partitions
      instead of both seeing every record and the paired comparison returns almost
      nothing. Bump the suffix in step with the generator's RUN_ID for a clean run; it
      also gives the buffer a fresh changelog.
    defaultValue: pr1110_buffered_r1
    required: true
  - name: AUTO_OFFSET_RESET
    inputType: FreeText
    description: >-
      latest, so a restart resumes at the live edge. With earliest, a restart after seeding
      would re-drain the whole backlog into a world where every configuration already
      exists - every replayed record would resolve on the first attempt and contaminate
      the table with rows that look late but never were.
    defaultValue: latest
    required: false
  - name: LOGLEVEL
    inputType: FreeText
    description: >-
      Application logging level. DEBUG surfaces the lookup's per-key "No configuration
      found" lines and the buffer's release/overflow warnings.
    defaultValue: INFO
    required: false
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
