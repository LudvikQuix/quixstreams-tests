name: lake-sink
language: python
variables:
  - name: input
    inputType: InputTopic
    description: Enriched records from both lookup-sink arms, distinguished by the arm column.
    defaultValue: enriched-sensor-data
    required: true
  - name: TABLE_NAME
    inputType: FreeText
    description: >-
      Base table name. Combined with TABLE_VERSION into the effective name
      (e.g. pr1110_grace_v1).
    defaultValue: pr1110_grace
    required: false
  - name: TABLE_VERSION
    inputType: FreeText
    description: >-
      Suffix appended to TABLE_NAME. BUMP THIS whenever HIVE_COLUMNS, TIMESTAMP_COLUMN or
      SORT_COLUMN changes - hive_columns is immutable once the table registers, the sink
      validates the partition set against the catalog spec at startup and raises on a
      mismatch, and table properties are written only at CREATE. A layout change is a
      migration, not a tweak. Blank the value for no suffix; delete the variable to get
      the v1 default back.
    defaultValue: v1
    required: false
  - name: HIVE_COLUMNS
    inputType: FreeText
    description: >-
      Comma-separated Hive partition columns. year/month/day/hour derive from
      TIMESTAMP_COLUMN and are physical-only; arm is the primary analysis slice and has
      cardinality 2. run_id is deliberately NOT partitioned - its cardinality grows with
      every run and would shatter the table into tiny parquet files. Prefix an entry with
      ~ to make it virtual. Every listed column must exist in the incoming payload.
      Changing this requires a TABLE_VERSION bump.
    defaultValue: year,month,day,hour,arm
    required: false
  - name: TIMESTAMP_COLUMN
    inputType: FreeText
    description: >-
      Absolute epoch-ms event time from the generator, which year/month/day/hour are
      derived from. If data-generator's TIMESTAMP_SKEW_MS escape hatch is ever used, change
      this to produced_ms (and bump TABLE_VERSION), or every row lands in a future hour
      partition.
    defaultValue: timestamp
    required: false
  - name: SORT_COLUMN
    inputType: FreeText
    description: >-
      Recorded as properties.sort_column at table creation; lakehouse compaction orders
      files by it. Emission order is the natural read order for this table. Setting it
      equal to TIMESTAMP_COLUMN is indistinguishable from unset. Blank the value for
      unset; delete the variable to get the emit_ms default back.
    defaultValue: emit_ms
    required: false
  - name: STATS_COLUMNS
    inputType: FreeText
    description: >-
      Comma-separated columns to compute per-file min/max zone maps for. Blank = every
      numeric and timestamp column, which here includes dwell_ms - exactly the column the
      verification queries prune on.
    defaultValue: ""
    required: false
  - name: AUTO_DISCOVER
    inputType: FreeText
    description: >-
      true/false. Register the table in the REST catalog on first write. false leaves
      partition_spec, sort_column and column_stats unrecorded.
    defaultValue: "true"
    required: false
  - name: CATALOG_NAMESPACE
    inputType: FreeText
    description: Catalog namespace for table registration.
    defaultValue: default
    required: false
  - name: BATCH_SIZE
    inputType: FreeText
    description: >-
      Input messages batched before a write. Counts INPUT messages, not output rows. At
      about 40 rows/s (two arms x 20 msg/s) this is roughly 25 s of data.
    defaultValue: "1000"
    required: false
  - name: COMMIT_INTERVAL
    inputType: FreeText
    description: >-
      Seconds between commits, and the flush cadence. With BATCH_SIZE it sets the parquet
      file size and bounds how stale a verification query can be.
    defaultValue: "30"
    required: false
  - name: CONSUMER_GROUP
    inputType: FreeText
    description: >-
      Kafka consumer group. Bump it to re-sink the topic from AUTO_OFFSET_RESET; pair with
      a TABLE_VERSION bump to avoid duplicate rows.
    defaultValue: pr1110_lake_v1
    required: false
  - name: AUTO_OFFSET_RESET
    inputType: FreeText
    description: >-
      earliest, so the table holds the run from its first record even if this deployment
      starts late. Unlike lookup-sink, replay here is harmless - the rows are already
      stamped.
    defaultValue: earliest
    required: false
  - name: MAX_WRITE_WORKERS
    inputType: FreeText
    description: How many files may be written to storage in parallel.
    defaultValue: "10"
    required: false
  - name: LOGLEVEL
    inputType: FreeText
    description: >-
      Application logging level. DEBUG logs each uploaded data file and sidecar.
    defaultValue: INFO
    required: false
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
