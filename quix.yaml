# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: MongoDB
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 800
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
  - name: Dynamic Configuration Manager
    application: DynamicConfiguration
    version: latest
    deploymentType: Managed
    resources:
      limits:
        cpu: 500
        memory: 1000
    publicAccess:
      enabled: true
      urlPrefix: config-api-svc
    network:
      serviceName: config-api-svc
    configuration:
      topic: config-updates
      mongoHost: mongodb
      mongoPort: 27017
      mongoUser: admin
      mongoPasswordSecret: mongo_password
      mongoDatabase: dcm
      mongoCollection: configurations
    plugin:
      embeddedView:
        enabled: true
        default: true
  - name: Data Generator
    application: data-generator
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 300
    desiredStatus: Running
    variables:
      - name: DEVICE_COUNT
        value: 2
      - name: SEEDED_DEVICE_COUNT
        value: 1
      - name: RUN_ID
        value: r13
      - name: LOG_EVERY
        value: 50
  - name: Config Seeder
    application: config-seeder
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 200
        memory: 300
    variables:
      - name: SEED_DELAY_SECONDS
        value: 15
      - name: DEVICE_COUNT
        value: 2
      - name: SEEDED_DEVICE_COUNT
        value: 1
      - name: CONFIG_TYPE
        value: device_r13
      - name: RUN_ID
        value: r13
  - name: Lookup Sink - Buffered
    application: lookup-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1000
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: GRACE_MS
        value: 30000
      - name: CONFIG_TYPE
        value: device_r13
      - name: SEEDED_DEVICE_COUNT
        value: 1
      - name: STAMP_MESSAGE_CONTEXT
        value: true
      - name: CONSUMER_GROUP
        value: pr1110_buffered_r13
  - name: Lookup Sink - Control
    application: lookup-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 300
        memory: 500
    desiredStatus: Running
    variables:
      - name: ARM
        value: control
      - name: BUFFER_ENABLED
        value: ''
      - name: GRACE_MS
        value: 30000
      - name: CONFIG_TYPE
        value: device_r13
      - name: SEEDED_DEVICE_COUNT
        value: 1
      - name: STAMP_MESSAGE_CONTEXT
        value: true
      - name: CONSUMER_GROUP
        value: pr1110_control_r13
  - name: Lake Sink
    application: lake-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1000
    desiredStatus: Running
    variables:
      - name: TABLE_VERSION
        value: v2
      - name: BATCH_SIZE
        value: 100
      - name: COMMIT_INTERVAL
        value: 10
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: sensor-data
    configuration:
      partitions: 4
      retentionInMinutes: 1440
  - name: config-updates
    configuration:
      partitions: 1
      retentionInMinutes: 43200
  - name: enriched-sensor-data
    configuration:
      partitions: 4
      retentionInMinutes: 1440
