# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: Session Probe Key
    application: session-probe
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: CONSUMER_GROUP
        value: sw_key_r4
  - name: Session Probe Partition
    application: session-probe
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: output
        value: session-out-partition
      - name: PROBE
        value: partition
      - name: CLOSING_STRATEGY
        value: partition
      - name: CONSUMER_GROUP
        value: sw_part_r4
  - name: Session Probe Current
    application: session-probe
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: output
        value: session-out-current
      - name: PROBE
        value: current
      - name: EMIT_MODE
        value: current
      - name: CONSUMER_GROUP
        value: sw_curr_r4
  - name: Session Generator
    application: session-generator
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 200
        memory: 300
    variables:
      - name: PHASE
        value: main
      - name: BASE_MS
        value: 1790082872305
      - name: RUN_ID
        value: r4
  - name: Session Generator V2
    application: session-generator-v2
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 300
    desiredStatus: Running
    variables:
      - name: RUN_ID
        value: r5
      - name: KEY_COUNT
        value: 4
      - name: OUT_OF_ORDER_PCT
        value: 0
      - name: LATE_PCT
        value: 0
  - name: Session Probe Key V2
    application: session-probe
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: input
        value: session-v2-in
      - name: output
        value: session-v2-out-key
      - name: CONSUMER_GROUP
        value: sw2_key_r5
  - name: Session Probe Partition V2
    application: session-probe
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: input
        value: session-v2-in
      - name: output
        value: session-v2-out-partition
      - name: PROBE
        value: partition
      - name: CLOSING_STRATEGY
        value: partition
      - name: CONSUMER_GROUP
        value: sw2_part_r5
  - name: Session Probe Current V2
    application: session-probe
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: input
        value: session-v2-in
      - name: output
        value: session-v2-out-current
      - name: PROBE
        value: current
      - name: EMIT_MODE
        value: current
      - name: CONSUMER_GROUP
        value: sw2_curr_r5
  - name: Session Verdict V2
    application: session-verdict
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 200
        memory: 500
    variables:
      - name: RUN_ID
        value: r5
      - name: CONSUMER_GROUP
        value: sv2_r5

# This section describes the Topics of the data pipeline
topics:
  - name: session-v2-in
    configuration:
      partitions: 2
      retentionInMinutes: 1440
  - name: session-v2-out-key
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: session-v2-out-partition
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: session-v2-out-current
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: session-v2-verdict
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: session-in
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: session-out-key
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: session-out-partition
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: session-out-current
    configuration:
      partitions: 1
      retentionInMinutes: 1440
