# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: Session Probe Key
    application: session-probe
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: input
        value: session-in
      - name: output
        value: session-out-key
      - name: PROBE
        value: key
      - name: EMIT_MODE
        value: final
      - name: CLOSING_STRATEGY
        value: key
      - name: GAP_MS
        value: 120000
      - name: GRACE_MS
        value: 0
      - name: STORE_NAME
        value: sess
      - name: CONSUMER_GROUP
        value: sw_key_r1
      - name: LOGLEVEL
        value: INFO
  - name: Session Probe Partition
    application: session-probe
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: input
        value: session-in
      - name: output
        value: session-out-partition
      - name: PROBE
        value: partition
      - name: EMIT_MODE
        value: final
      - name: CLOSING_STRATEGY
        value: partition
      - name: GAP_MS
        value: 120000
      - name: GRACE_MS
        value: 0
      - name: STORE_NAME
        value: sess
      - name: CONSUMER_GROUP
        value: sw_part_r1
      - name: LOGLEVEL
        value: INFO
  - name: Session Probe Current
    application: session-probe
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: input
        value: session-in
      - name: output
        value: session-out-current
      - name: PROBE
        value: current
      - name: EMIT_MODE
        value: current
      - name: CLOSING_STRATEGY
        value: key
      - name: GAP_MS
        value: 120000
      - name: GRACE_MS
        value: 0
      - name: STORE_NAME
        value: sess
      - name: CONSUMER_GROUP
        value: sw_curr_r1
      - name: LOGLEVEL
        value: INFO
  - name: Session Generator
    application: session-generator
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 200
        memory: 300
    variables:
      - name: output
        value: session-in
      # s7a on creation: a newly created Job runs once immediately. The operator
      # PATCHes this to s7b (after restarting the probes) and then to main.
      - name: PHASE
        value: s7a
      # Set by the operator before the first sync - runbook step 1 - and kept
      # IDENTICAL across all three phase runs. Blank means "use now", which is only
      # valid for a single-phase run.
      - name: BASE_MS
        value: 1790079119719
      - name: RUN_ID
        value: r1

# This section describes the Topics of the data pipeline
topics:
  - name: session-in
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: session-out-key
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: session-out-partition
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: session-out-current
    configuration:
      partitions: 1
      retentionInMinutes: 1440
