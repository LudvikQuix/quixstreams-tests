# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.
#
# PR1110 LookupBuffer grace-period test rig. Spec:
# dev-planning/pr1110-grace-period/spec.md
#
# Deploy order matters (spec section 9): MongoDB, then the Dynamic Configuration Manager,
# then both Lookup Sink arms and the Lake Sink, and only then the Data Generator. The
# Config Seeder Job auto-runs the moment it is first created, so treat the minute the
# Data Generator starts as T+0 and re-run the Job from the Portal if it fired early.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  # Backing store for the Dynamic Configuration Manager's configuration documents.
  # serviceName MUST stay `mongodb`: that is the MONGO_HOST the `mongodb-connection`
  # variable group supplies to the DCM.
  - name: MongoDB
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 800
    state:
      enabled: true
      size: 1
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
    desiredStatus: Running
    variables:
      - name: MONGO_INITDB_ROOT_USERNAME
        inputType: FreeText
        required: true
        value: admin
      - name: MONGO_INITDB_ROOT_PASSWORD
        inputType: Secret
        required: true
        value: mongo_password
      # Bump to an unused sibling (mongodb-v3, ...) to force a clean database with no
      # shell in the container; the entry point never deletes the old directory. A wipe
      # invalidates every configuration `config-updates` still references - delete and
      # recreate that topic in the same action, and bump RUN_ID.
      - name: MONGO_DBPATH
        inputType: FreeText
        required: true
        value: /app/state/mongodb-v2

  # Managed library item, no repo directory. Needs the workspace secret `mongo_password`
  # to exist before it can authenticate to MongoDB.
  - name: Dynamic Configuration Manager
    application: DynamicConfiguration
    version: latest
    deploymentType: Managed
    resources:
      cpu: 500
      memory: 1000
      replicas: 1
    # urlPrefix also fixes the in-cluster service name, so it must stay equal to the
    # host in config-seeder's DCM_API_URL.
    publicAccess:
      enabled: true
      urlPrefix: config-api-svc
    # A Managed deployment configures itself through `configuration:`, not `variables:`.
    # The keys are the library item's setting names, not env var names.
    configuration:
      topic: config-updates
      consumerGroup: config-api-v1
      # The library item advertises a `mongoConnectionGroup` (VariableGroup) setting, but
      # the sync validator on this cluster rejects it with "Configuration for variable
      # 'MONGO_HOST' is required but not provided" even with the group created, populated
      # and assigned. The individual settings below are what every working DCM in this
      # org uses, so they are the supported form here.
      # mongoPasswordSecret names a WORKSPACE SECRET, not a literal password; that secret
      # must hold the same value as the mongodb deployment's MONGO_INITDB_ROOT_PASSWORD,
      # or the DCM cannot authenticate and every record looks unresolvable.
      mongoHost: mongodb
      mongoPort: 27017
      mongoUser: admin
      mongoPasswordSecret: mongo_password
      mongoDatabase: dcm
      mongoCollection: configurations
      # `mongo` keeps blob storage off the DCM's critical path. `file` would make the
      # Storage Gateway a hard dependency of configuration delivery, i.e. of the thing
      # under test. The configs here are under 1 KB.
      contentStore: mongo
      workers: 1
      port: 80
    plugin:
      embeddedView:
        enabled: true
        default: true

  # Starts Stopped on purpose. The moment it starts is T+0 for the whole experiment, and
  # both Lookup Sink arms must already be consuming before then (spec section 9 step 7);
  # otherwise every record resolves on the first attempt and nothing ever buffers.
  - name: Data Generator
    application: data-generator
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 300
    desiredStatus: Stopped
    variables:
      - name: output
        inputType: OutputTopic
        required: true
        value: sensor-data
      - name: DEVICE_COUNT
        inputType: FreeText
        value: "100"
      - name: SEEDED_DEVICE_COUNT
        inputType: FreeText
        value: "50"
      - name: SLEEP_SECONDS
        inputType: FreeText
        value: "0.05"
      # Escape hatch only; 0 = off. See spec section 2.4.
      - name: TIMESTAMP_SKEW_MS
        inputType: FreeText
        value: "0"
      - name: RUN_ID
        inputType: FreeText
        value: r1
      - name: LOG_EVERY
        inputType: FreeText
        value: "200"

  # A Job block carries no desiredStatus, state or network. Only a NEWLY CREATED Job
  # auto-runs on sync; converting an existing Service to a Job leaves it Stopped. To
  # re-seed, restart the Job from the Portal - `replace: true` makes it idempotent.
  - name: Config Seeder
    application: config-seeder
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 200
        memory: 300
    variables:
      # In-cluster DNS for the managed DCM's `network.serviceName`, port 80, no token.
      - name: DCM_API_URL
        inputType: FreeText
        required: true
        value: http://config-api-svc
      - name: DCM_API_TOKEN
        inputType: Secret
        value: ""
      # The instrument. Must exceed pod start-up and be shorter than GRACE_MS/1000.
      - name: SEED_DELAY_SECONDS
        inputType: FreeText
        value: "120"
      - name: DEVICE_COUNT
        inputType: FreeText
        value: "100"
      - name: SEEDED_DEVICE_COUNT
        inputType: FreeText
        value: "50"
      - name: CONFIG_TYPE
        inputType: FreeText
        value: device
      # Load-bearing. Without the backdate, find_valid_version() rejects every pre-seed
      # record and the rig runs green while proving nothing.
      - name: VALID_FROM_BACKDATE_SECONDS
        inputType: FreeText
        value: "86400"
      - name: RUN_ID
        inputType: FreeText
        value: r1

  # The service under test, arm 1. `state: {enabled: true}` is NOT optional here: the
  # buffer is a changelog-backed timestamped store and a misconfigured deployment fails
  # loudly at startup.
  - name: Lookup Sink - Buffered
    application: lookup-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1000
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: input
        inputType: InputTopic
        required: true
        value: sensor-data
      - name: config_topic
        inputType: InputTopic
        required: true
        value: config-updates
      - name: output
        inputType: OutputTopic
        required: true
        value: enriched-sensor-data
      - name: ARM
        inputType: FreeText
        value: buffered
      - name: BUFFER_ENABLED
        inputType: FreeText
        value: "true"
      - name: GRACE_MS
        inputType: FreeText
        value: "300000"
      - name: ON_TIMEOUT
        inputType: FreeText
        value: emit
      - name: MAX_BUFFERED_PER_KEY
        inputType: FreeText
        value: "10000"
      - name: ON_OVERFLOW
        inputType: FreeText
        value: drop-newest
      - name: STORE_NAME
        inputType: FreeText
        value: lookup-buffer
      - name: CONFIG_TYPE
        inputType: FreeText
        value: device
      - name: SEEDED_DEVICE_COUNT
        inputType: FreeText
        value: "50"
      # Must differ from the control arm's, or the two split the partitions instead of
      # each seeing every record and the paired comparison returns almost nothing.
      - name: CONSUMER_GROUP
        inputType: FreeText
        required: true
        value: pr1110_buffered_r1
      - name: AUTO_OFFSET_RESET
        inputType: FreeText
        value: latest
      - name: LOGLEVEL
        inputType: FreeText
        value: INFO

  # The same application directory, second deployment. BUFFER_ENABLED blank means
  # buffer=None, which is today's unbuffered behaviour exactly - that IS the control.
  # It deliberately has NO `state:` block: buffer=None registers no store, so if this
  # deployment ever fails at startup demanding state, that is itself a finding.
  - name: Lookup Sink - Control
    application: lookup-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 300
        memory: 500
    desiredStatus: Running
    variables:
      - name: input
        inputType: InputTopic
        required: true
        value: sensor-data
      - name: config_topic
        inputType: InputTopic
        required: true
        value: config-updates
      - name: output
        inputType: OutputTopic
        required: true
        value: enriched-sensor-data
      - name: ARM
        inputType: FreeText
        value: control
      - name: BUFFER_ENABLED
        inputType: FreeText
        value: ""
      - name: GRACE_MS
        inputType: FreeText
        value: "300000"
      - name: ON_TIMEOUT
        inputType: FreeText
        value: emit
      - name: MAX_BUFFERED_PER_KEY
        inputType: FreeText
        value: "10000"
      - name: ON_OVERFLOW
        inputType: FreeText
        value: drop-newest
      - name: STORE_NAME
        inputType: FreeText
        value: lookup-buffer
      - name: CONFIG_TYPE
        inputType: FreeText
        value: device
      - name: SEEDED_DEVICE_COUNT
        inputType: FreeText
        value: "50"
      - name: CONSUMER_GROUP
        inputType: FreeText
        required: true
        value: pr1110_control_r1
      - name: AUTO_OFFSET_RESET
        inputType: FreeText
        value: latest
      - name: LOGLEVEL
        inputType: FreeText
        value: INFO

  # Separate from the service under test on purpose: a blobStorage bind failure must not
  # be able to block the experiment, only its reporting surface.
  - name: Lake Sink
    application: lake-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 1000
    desiredStatus: Running
    variables:
      - name: input
        inputType: InputTopic
        required: true
        value: enriched-sensor-data
      - name: TABLE_NAME
        inputType: FreeText
        value: pr1110_grace
      # Bump together with any HIVE_COLUMNS / TIMESTAMP_COLUMN / SORT_COLUMN change.
      - name: TABLE_VERSION
        inputType: FreeText
        value: v1
      - name: HIVE_COLUMNS
        inputType: FreeText
        value: year,month,day,hour,arm
      - name: TIMESTAMP_COLUMN
        inputType: FreeText
        value: timestamp
      - name: SORT_COLUMN
        inputType: FreeText
        value: emit_ms
      - name: STATS_COLUMNS
        inputType: FreeText
        value: ""
      - name: AUTO_DISCOVER
        inputType: FreeText
        value: "true"
      - name: CATALOG_NAMESPACE
        inputType: FreeText
        value: default
      - name: BATCH_SIZE
        inputType: FreeText
        value: "1000"
      - name: COMMIT_INTERVAL
        inputType: FreeText
        value: "30"
      - name: CONSUMER_GROUP
        inputType: FreeText
        value: pr1110_lake_v1
      - name: AUTO_OFFSET_RESET
        inputType: FreeText
        value: earliest
      - name: MAX_WRITE_WORKERS
        inputType: FreeText
        value: "10"
      - name: LOGLEVEL
        inputType: FreeText
        value: INFO
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  # Keyed sensor records. 4 partitions: both lookup-sink arms are single-replica so one
  # consumer takes all 4, but the buffer's sweep cursor is PER-PARTITION - a partition
  # holding buffered keys but receiving no records never settles them. Round-robin over
  # 100 device keys hashes across all four, so no partition is ever starved of the
  # traffic that drives its own sweep. 4 also leaves room to raise replicas later: a
  # 1-partition topic can only ever have one consumer, no matter how many are added.
  - name: sensor-data
    configuration:
      partitions: 4
      retentionInMinutes: 1440

  # DCM configuration change events. 1 partition: ordering of version events for one
  # configuration must be total, the volume is 50 messages per run, and the lookup
  # ASSIGNS every partition from offset 0 on each start regardless. Retention 30 days,
  # not the 1 day default: the SDK rebuilds the whole configuration version history from
  # this topic on every restart, so truncating it silently un-configures every device.
  - name: config-updates
    configuration:
      partitions: 1
      retentionInMinutes: 43200

  # Enriched output from both arms, distinguished by the `arm` column. 4 partitions to
  # match sensor-data so the lake sink can be scaled out later.
  - name: enriched-sensor-data
    configuration:
      partitions: 4
      retentionInMinutes: 1440

# The buffer's changelog topic is created automatically by QuixStreams and must NOT be
# declared here. Bumping CONSUMER_GROUP or STORE_NAME yields a fresh one.
