# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: Session Probe Key
    application: session-probe
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Running
  - name: Session Probe Partition
    application: session-probe
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: output
        value: session-out-partition
      - name: PROBE
        value: partition
      - name: CLOSING_STRATEGY
        value: partition
      - name: CONSUMER_GROUP
        value: sw_part_r1
  - name: Session Probe Current
    application: session-probe
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    state:
      enabled: true
      size: 1
    desiredStatus: Running
    variables:
      - name: output
        value: session-out-current
      - name: PROBE
        value: current
      - name: EMIT_MODE
        value: current
      - name: CONSUMER_GROUP
        value: sw_curr_r1
  - name: Session Generator
    application: session-generator
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 200
        memory: 300
    variables:
      - name: BASE_MS
        value: 1790079119719

# This section describes the Topics of the data pipeline
topics:
  - name: session-in
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: session-out-key
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: session-out-partition
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: session-out-current
    configuration:
      partitions: 1
      retentionInMinutes: 1440
  - name: sensor-data
  - name: config-updates
